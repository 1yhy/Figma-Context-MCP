<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px;
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      color: #fff;
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .header p {
      color: rgba(255, 255, 255, 0.6);
      font-size: 14px;
    }

    .preview-wrapper {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .canvas {
      position: relative;
      background: linear-gradient(180deg, #1e1e3f 0%, #0a0a1a 100%);
      border-radius: 12px;
      overflow: hidden;
    }

    .node {
      position: absolute;
      overflow: hidden;
    }

    .node-frame {
      background: linear-gradient(180deg, rgba(139, 92, 246, 0.15) 0%, rgba(30, 30, 60, 0.9) 100%);
    }

    .node-text {
      white-space: nowrap;
    }

    .node-vector,
    .node-group {
      overflow: visible;
    }

    .vector-placeholder {
      width: 100%;
      height: 100%;
      border-radius: 4px;
      opacity: 0.9;
    }

    .footer {
      margin-top: 30px;
      text-align: center;
    }

    .footer p {
      color: rgba(255, 255, 255, 0.5);
      font-size: 12px;
    }

    .stats {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    .stat {
      background: rgba(255, 255, 255, 0.1);
      padding: 10px 20px;
      border-radius: 8px;
      color: rgba(255, 255, 255, 0.8);
      font-size: 12px;
    }

    .stat strong {
      color: #a78bfa;
    }

    /* 模拟短视频背景 */
    .node-frame::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 220px;
      background:
        radial-gradient(ellipse at 30% 20%, rgba(139, 92, 246, 0.4) 0%, transparent 50%),
        radial-gradient(ellipse at 70% 60%, rgba(236, 72, 153, 0.3) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 80%, rgba(59, 130, 246, 0.2) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    /* 播放按钮 */
    .node-frame::after {
      content: '▶';
      position: absolute;
      top: 100px;
      left: 50%;
      transform: translateX(-50%);
      width: 50px;
      height: 50px;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      color: #fff;
      z-index: 1;
    }
  </style>
</head>
